services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: agentmesh
      POSTGRES_DB: agentmesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis 身兼两职：gateway-service 的限流令牌桶，以及 asynq（用量事件异步队列）的存储后端。
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
